# This is a basic workflow to help you get started with Actions

name: rg-connectivity-001

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    paths:
      - '.github/tf-folder/*.tf'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  resourcegroups:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    
    # name: 'rg-connectivity-001'
    # env:
    #   ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    #   ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    #   ARM_SUBSCRIPTION_ID: ${{ secrets.MVP_SUBSCRIPTION }}
    #   ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    #cd Subscriptions/Sub-MVP-Sponsorship/rg-connectivity-001
            
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Step to Checkout your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Terraform installation
        uses: hashicorp/setup-terraform@v3

      # Step to log in to Azure using the Azure CLI GitHub Action
      - name: Log in to Azure CLI
        uses: azure/login@v2
        with: 
          creds: ${{ secrets.AZURE_CREDENTAILS }}
      
      # AZURE_CREDENTIALS SPELLING IS WRONG ABOVE

      # Runs a single command using the runners shell
      - name: 'Terraform init'
        id: init
        run: |
          cd ./.github/tf-folder
          terraform init          

      - name: 'Terraform plan'
        id: plan
        run: |
          az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.TENANT_ID }}
          cd ./.github/tf-folder
          terraform plan
                    
      - name: 'Terraform apply'
        id: apply
        run: |
          az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.TENANT_ID }}
          cd ./.github/tf-folder
          terraform apply -auto-approve          
